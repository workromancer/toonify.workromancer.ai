services:
  db:
    image: pgvector/pgvector:pg16
    container_name: toonify-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: toonify
      POSTGRES_PASSWORD: password
      POSTGRES_DB: toonify_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: toonify-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/toonify-assets;
      /usr/bin/mc policy set public myminio/toonify-assets;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
