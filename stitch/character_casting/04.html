<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>New Character Casting - Toonify</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3713ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>

<body class="bg-background-dark font-display">

            class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#292348] px-6 py-3 shrink-0">
            <div class="flex items-center gap-4 text-white">
                <div class="size-6 text-white">
                    <svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">

                </div>
                <h1 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Toonify</h1>
            </div>
            <div class="flex flex-1 justify-end gap-8">
                <div class="flex gap-2">
                    <button

                    </button>
                    <button
                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em]">
                        <span class="truncate">Projects</span>
                    </button>
                </div>
                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                    data-alt="User avatar with a gradient background"
                    style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDrqO7C-G1-aHKODVaVHdHrk9OR4JLF6w8u6sy7rmr0chDt9RxMnMUQqnAWkyKoGy_drPDCKm7yWOzDr5sG55_Qm7rOyjL-I7l0Z5zNTM5jD3Rb6EJ9zKxkmsIb8IrImLiT7ElIh5E2Es0UFPo0R8YfDh48aR5ImdVMB19T0ko8tezG9x6DyxJ3d3y3kuXp9WvcJA8gGt8Jun9pP8TZwdJbuJiD_ZatzXvuTAdLtmmmgCDiSTJMqG9k6kOrzeBHj68rvGeJy5rmQqU");'>
                </div>
            </div>
        </header>
        <main class="flex flex-1 overflow-hidden">
            <div class="grid grid-cols-12 flex-1">
                <!-- Left Column (Controls) -->
                <div class="col-span-3 flex flex-col border-r border-[#292348] overflow-y-auto">
                    <div class="p-6">
                        <div class="flex min-w-72 flex-col gap-2">
                            <p class="text-white text-4xl font-black leading-tight tracking-[-0.033em]">New Character
                                Casting</p>
                            <p class="text-[#9b92c9] text-base font-normal leading-normal">Define the new character's
                                traits, and the AI will generate the character in real-time.</p>
                        </div>
                    </div>
                    <div class="px-6 py-4 space-y-6 flex-1">
                        <h2 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] pt-2">Define Your
                            Character</h2>
                        <!-- Character Name -->
                        <div class="flex flex-col">
                            <label class="text-white text-base font-medium leading-normal pb-2">Character Name</label>
                            <input
                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border border-[#3b3267] bg-[#1e1933] focus:border-[#3b3267] h-14 placeholder:text-[#9b92c9] p-[15px] text-base font-normal leading-normal"
                                placeholder="e.g., Kaelen Shadowblade" value="" />
                        </div>
                        <!-- Appearance Tags -->
                        <div class="flex flex-col">
                            <label class="text-white text-base font-medium leading-normal pb-2">Appearance Tags</label>
                            <div
                                class="flex items-center w-full min-w-0 rounded-lg border border-[#3b3267] bg-[#1e1933] focus-within:border-primary p-2 flex-wrap gap-2">
                                <div
                                    class="flex h-8 shrink-0 items-center justify-center gap-x-1 rounded-lg bg-[#292348] pl-3 pr-2">
                                    <p class="text-white text-sm font-medium leading-normal">long silver hair</p>
                                    <button class="text-white/70 hover:text-white"><span
                                            class="material-symbols-outlined text-base">close</span></button>
                                </div>
                                <div
                                    class="flex h-8 shrink-0 items-center justify-center gap-x-1 rounded-lg bg-[#292348] pl-3 pr-2">
                                    <p class="text-white text-sm font-medium leading-normal">red eyes</p>
                                    <button class="text-white/70 hover:text-white"><span
                                            class="material-symbols-outlined text-base">close</span></button>
                                </div>
                                <div
                                    class="flex h-8 shrink-0 items-center justify-center gap-x-1 rounded-lg bg-[#292348] pl-3 pr-2">
                                    <p class="text-white text-sm font-medium leading-normal">wearing glasses</p>
                                    <button class="text-white/70 hover:text-white"><span
                                            class="material-symbols-outlined text-base">close</span></button>
                                </div>
                                <input
                                    class="form-input flex-1 bg-transparent border-0 focus:ring-0 text-white placeholder:text-[#9b92c9] min-w-[120px]"
                                    placeholder="Add a tag..." />
                            </div>
                        </div>
                        <!-- Style Preset -->
                        <div class="flex flex-col">
                            <label class="text-white text-base font-medium leading-normal pb-2">Style Preset</label>
                            <div class="relative">
                                <select
                                    class="form-select appearance-none w-full rounded-lg text-white focus:outline-0 focus:ring-0 border border-[#3b3267] bg-[#1e1933] focus:border-[#3b3267] h-14 p-[15px] text-base font-normal leading-normal">
                                    <option>Shonen</option>
                                    <option>Shojo</option>
                                    <option>Fantasy</option>
                                    <option>Sci-fi</option>
                                </select>
                                <span
                                    class="material-symbols-outlined text-[#9b92c9] absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">expand_more</span>
                            </div>
                        </div>
                        <!-- Current Mood -->
                        <div class="flex flex-col">
                            <label class="text-white text-base font-medium leading-normal pb-2">Current Mood</label>
                            <div class="grid grid-cols-4 gap-3">
                                <button
                                    class="flex flex-col items-center justify-center gap-2 rounded-lg p-3 aspect-square bg-[#292348] border-2 border-transparent hover:border-primary/50 text-[#9b92c9] hover:text-white">
                                    <span class="material-symbols-outlined !text-4xl">sentiment_very_satisfied</span>
                                    <p class="text-sm">Happy</p>
                                </button>
                                <button
                                    class="flex flex-col items-center justify-center gap-2 rounded-lg p-3 aspect-square bg-[#292348] border-2 border-primary text-white">
                                    <span class="material-symbols-outlined !text-4xl">sentiment_neutral</span>
                                    <p class="text-sm">Neutral</p>
                                </button>
                                <button
                                    class="flex flex-col items-center justify-center gap-2 rounded-lg p-3 aspect-square bg-[#292348] border-2 border-transparent hover:border-primary/50 text-[#9b92c9] hover:text-white">
                                    <span class="material-symbols-outlined !text-4xl">sentiment_sad</span>
                                    <p class="text-sm">Sad</p>
                                </button>
                                <button
                                    class="flex flex-col items-center justify-center gap-2 rounded-lg p-3 aspect-square bg-[#292348] border-2 border-transparent hover:border-primary/50 text-[#9b92c9] hover:text-white">
                                    <span class="material-symbols-outlined !text-4xl">sentiment_frustrated</span>
                                    <p class="text-sm">Angry</p>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="p-6 mt-auto">
                        <button
                            class="flex w-full items-center justify-center gap-2 rounded-lg h-14 px-4 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em]">
                            <span class="material-symbols-outlined">auto_awesome</span>
                            <span class="truncate">Generate</span>
                        </button>
                    </div>
                </div>
                <!-- Center Column (Canvas) -->
                <div class="col-span-6 flex items-center justify-center p-8 bg-[#100e1c]">
                    <div
                        class="w-full max-w-2xl aspect-[3/4] rounded-xl bg-[#1e1933] border-2 border-dashed border-[#292348] flex flex-col items-center justify-center text-center relative group">

                        </div>
                        <div
                            class="absolute bottom-4 left-4 right-4 flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <button
                                class="flex items-center justify-center gap-2 h-12 px-5 bg-white/10 backdrop-blur-md text-white rounded-lg hover:bg-white/20">
                                <span class="material-symbols-outlined">refresh</span>
                                Vary
                            </button>
                            <button
                                class="flex items-center justify-center gap-2 h-12 px-5 bg-white/10 backdrop-blur-md text-white rounded-lg hover:bg-white/20">
                                <span class="material-symbols-outlined">download</span>
                                Download

                        </div>
                    </div>

                    <div class="p-6">

                    </div>
                    <div class="px-6 space-y-4">
                        <div

                            <p class="text-white font-medium">Ren</p>
                        </div>
                        <div
                            class="flex items-center gap-4 p-3 rounded-lg bg-[#1e1933] cursor-pointer hover:bg-[#292348]">
                            <img class="size-16 rounded-lg object-cover" data-alt="Thumbnail of character named Akira"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcBB23SAkcNGI2-KmwWR85qmPIq3u2yFjsMKcPQakCB2TXAWPZOm4nksn067eI7fdmwgtbonBvaVJdMMRttfCnUUBYbmKite5e-GEObcNgBGctLaW999oXfJ0e51CGBesUk-NgcOgX3W1ARYFVYndbW9ToPnsn4cUnauloLCH-r-Ngtf_tzS7GG69NuesSnhvex6rm6UAtW_un6ArCYqOAtgfOlrgSlHd_dcsbDjb_MHOMT4nshGqIO4BvUtwnVWlmm75dBYisg5M" />
                            <p class="text-white font-medium">Akira</p>
                        </div>
                        <div
                            class="flex items-center gap-4 p-3 rounded-lg bg-[#1e1933] cursor-pointer hover:bg-[#292348]">
                            <img class="size-16 rounded-lg object-cover" data-alt="Thumbnail of character named Yuna"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYOh89iVIsBRmSoePdpr1-rwar0gCNZVjrke2ucsg2aWTT9nXV_5F6b7Zltrflo7yegapA1_P5qBfdv86uqN47Wu7JCmokKRFl_HnrsZo59VhdHrUGmvAKXOwkEST5Ib6yyk6nuZX54e7a-HiPuSK9EgHV0kYNVmWheEHxrWZtMTndjBB-yHwzhxe6gxR1dLvtxozX2bj1PBMWr-BpvZkLapy6vzt12UaeBg_izb9oelPDVCTWeuN64TP-yoGJZ53wxHaubEW87Ks" />

                        </div>
                        <div
                            class="flex items-center gap-4 p-3 rounded-lg bg-[#1e1933] cursor-pointer hover:bg-[#292348]">
                            <img class="size-16 rounded-lg object-cover" data-alt="Thumbnail of character named Kenji"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwB883rz96EN29Zm92fHMurjGlF4UXwznH-yumq6SBdbKCqHjFYMi76r3Ae7hx_RmnGMIkLblwgRTP2TwXm2VmITh0hEPxWkkidWbJVe90RCvlIToNGLj7TKWRy1Y2ne6_H3FzAFv9omGsrt7FZfN8dOOlBvzNu8Rf4-NRbasyOQpWwB7plEatgDzATxsmJUgKee9QxPRNMD8FtaGwq44CwKH6bGCT5u5LEieiex6yXOlu4zNrUSdxlfG8i8l9v9WCjn9RTkDpie8" />

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
