<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Toonify - Review &amp; Refine Character</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6366F1", // indigo-500
                        "background-light": "#F9FAFB", // gray-50
                        "background-dark": "#111827", // gray-900
                    },
                    fontFamily: {
                        display: ["Poppins", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem", // 8px
                        lg: "0.75rem", // 12px
                        xl: "1rem", // 16px
                    },
                },
            },
        };
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200">
    <div class="flex flex-col min-h-screen">
        <header
            class="bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm border-b border-gray-200 dark:border-gray-800 sticky top-0 z-10">
            <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <svg class="w-8 h-8 text-primary" fill="none" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 2C6.477 2 2 6.477 2 12C2 17.523 6.477 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2ZM8.5 8.5C9.328 8.5 10 9.172 10 10C10 10.828 9.328 11.5 8.5 11.5C7.672 11.5 7 10.828 7 10C7 9.172 7.672 8.5 8.5 8.5ZM15.5 8.5C16.328 8.5 17 9.172 17 10C17 10.828 16.328 11.5 15.5 11.5C14.672 11.5 14 10.828 14 10C14 9.172 14.672 8.5 15.5 8.5ZM16.342 14.996C15.895 16.208 14.698 17 12 17C9.302 17 8.105 16.208 7.658 14.996C7.535 14.659 7.79 14.28 8.158 14.28H15.842C16.21 14.28 16.465 14.659 16.342 14.996Z"
                            fill="currentColor"></path>
                    </svg>
                    <span class="text-xl font-bold text-gray-900 dark:text-white">Toonify</span>
                </div>
                <div class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-600 dark:text-gray-300">
                    <a class="hover:text-primary transition-colors" href="#">Projects</a>
                    <a class="hover:text-primary transition-colors" href="#">Characters</a>
                    <a class="hover:text-primary transition-colors" href="#">Storyboards</a>
                    <a class="hover:text-primary transition-colors" href="#">Export</a>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-600 transition-colors">
                        Save Project
                    </button>
                    <img alt="User avatar" class="w-9 h-9 rounded-full border-2 border-primary"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOLdqBvw7i010Idg44H5f4A_AaTQK47LfSUvwllIfYvV3pyIcdaJS6eELepAN7YC45H9n0U9QUkZ-AnWmcQdgCKoOb3_P45Na-5F-8xLukpWs5s4WitcUDxyCCZHlI53t6K5xmVk-krKxsokBfrubNWaccl0IrAN-bnAaNkTmBsSdEOIN0L6KMJF7EZiyY2IA5_DuZR64P2XQivBsXobxvrEXZ3LJyhyoiRIsV70YSTITYJKovA4qeubTrxYukLqTgqyy2-iVRrPA" />
                </div>
            </nav>
        </header>
        <main class="flex-grow container mx-auto px-6 py-8">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">First Character Casting: Review &amp;
                    Refine</h1>
                <p class="text-gray-500 dark:text-gray-400 mb-8">Step 3 of 3: Review</p>
                <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mb-12">
                    <div class="bg-primary h-2.5 rounded-full" style="width: 100%"></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <div class="flex flex-col items-center">
                        <div
                            class="bg-gray-100 dark:bg-gray-800 rounded-xl p-4 border border-gray-200 dark:border-gray-700 shadow-lg w-full max-w-md">
                            <img alt="AI-generated illustration of a female cyberpunk rebel with pink hair holding a gun"
                                class="w-full h-auto object-cover rounded-lg"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBiSknkxpVzBAEp8HG2K1spCnJNarVsX8LAb_HvHITvZmI_Xm6DJsNQJKARVacfgDtqqq7Pom1xyrxyJrfitAUlS0ORPFdEp5o0eXiF66kogrelncwFDUkMgTofANJkIlBg-R8R28n1CErE6_iHB1vm5yb6HeGO46Bp4h5gcb-gsaDsS6TNZU7XUBYPkvkX7w3G3K8zxWs8E4Y4h8wZ5nHiJkxQmlO-I39B7Q_-H2DkrwZipveLBa3kkT2lBJoKuaxST9P-03DDjIQ" />
                        </div>
                        <div class="text-center mt-6">
                            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Cyberpunk Rebel</h2>
                            <div class="flex flex-wrap justify-center gap-2 mt-4">
                                <span
                                    class="bg-indigo-100 text-indigo-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-indigo-900 dark:text-indigo-300">Serious</span>
                                <span
                                    class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-gray-700 dark:text-gray-300">Spiky
                                    hair</span>
                                <span
                                    class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-gray-700 dark:text-gray-300">Scar</span>
                                <span
                                    class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-gray-700 dark:text-gray-300">Trench
                                    coat</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <div class="space-y-8">
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">Refine Appearance
                                </h3>
                                <button
                                    class="w-full flex items-center justify-center gap-2 bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 px-6 py-3 rounded-lg font-semibold hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                                    <span class="material-symbols-outlined">auto_awesome</span>
                                    Regenerate Appearance
                                </button>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">Subtle Expression
                                    Change</h3>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <button
                                        class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 py-2 px-4 rounded-lg text-sm font-medium hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white transition-all">Smile</button>
                                    <button
                                        class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 py-2 px-4 rounded-lg text-sm font-medium hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white transition-all">Frown</button>
                                    <button
                                        class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 py-2 px-4 rounded-lg text-sm font-medium hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white transition-all">Surprised</button>
                                    <button
                                        class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 py-2 px-4 rounded-lg text-sm font-medium hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white transition-all">Neutral</button>
                                </div>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">Outfit Variant</h3>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <button
                                        class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 py-2 px-4 rounded-lg text-sm font-medium hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white transition-all">Variant
                                        1</button>
                                    <button
                                        class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 py-2 px-4 rounded-lg text-sm font-medium hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white transition-all">Variant
                                        2</button>
                                    <button
                                        class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 py-2 px-4 rounded-lg text-sm font-medium hover:bg-primary hover:text-white dark:hover:bg-primary dark:hover:text-white transition-all">Variant
                                        3</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer
            class="bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm border-t border-gray-200 dark:border-gray-800 mt-auto">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <button
                    class="flex items-center gap-2 bg-transparent text-gray-600 dark:text-gray-300 font-semibold px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Back
                </button>
                <button
                    class="flex items-center gap-2 bg-primary text-white font-semibold px-6 py-3 rounded-lg hover:bg-indigo-600 transition-colors">
                    Save Character
                    <span class="material-symbols-outlined">check_circle</span>
                </button>
            </div>
        </footer>
    </div>

</body>

</html>
