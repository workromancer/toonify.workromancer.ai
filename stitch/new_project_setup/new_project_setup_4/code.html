<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create a New Project</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Custom Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-dark': '#10111A',
            'brand-card': '#1E1F2B',
            'brand-purple': '#6039FE',
            'brand-blue': '#4B38FE',
            'brand-text-primary': '#e0e0e0',
            'brand-text-secondary': '#8A8B93',
            'brand-border': '#4a5568',
            'brand-button-back': '#343644',
            'brand-button-back-hover': '#4a4c5a',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for specific elements like the progress bar -->
<style data-purpose="custom-progress-bar">
    .progress-bar-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .progress-bar-line {
      position: absolute;
      top: 50%;
      left: 0;
      height: 2px;
      transform: translateY(-50%);
      background-color: #343644;
      width: 100%;
      z-index: 1;
    }
    .progress-bar-active-line {
      position: absolute;
      top: 50%;
      left: 0;
      height: 2px;
      transform: translateY(-50%);
      background: linear-gradient(to right, #4B38FE, #6039FE);
      z-index: 2;
    }
    .progress-step {
      position: relative;
      z-index: 3;
    }
  </style>
</head>
<body class="bg-brand-dark antialiased font-sans text-brand-text-primary">
<!-- BEGIN: MainContainer -->
<div class="min-h-screen flex items-center justify-center p-4">
<!-- BEGIN: ProjectCreationForm -->
<main class="bg-brand-card rounded-lg p-8 shadow-2xl w-full max-w-xl" id="project-creation-form">
<!-- Form Header -->
<header class="mb-8">
<h1 class="text-2xl font-bold text-white mb-6">Create a New Project</h1>
<!-- BEGIN: ProgressBar -->
<div class="w-full" data-purpose="progress-bar-wrapper">
<div class="progress-bar-container">
<!-- Background line for the progress bar -->
<div class="progress-bar-line"></div>
<!-- Active state line for the progress bar -->
<div class="progress-bar-active-line" style="width: 33.33%; background-color: #6039FE;"></div>
<!-- Step 1: Title -->
<div class="progress-step text-center w-1/4">
<div class="w-4 h-4 rounded-full mx-auto mb-2" style="background-color: #6039FE;"></div>
<span class="text-xs">Title</span>
</div>
<!-- Step 2: Subtitle (Active) -->
<div class="progress-step text-center w-1/4">
<div class="w-4 h-4 rounded-full mx-auto mb-2" style="background-color: #6039FE;"></div>
<span class="text-xs text-white font-semibold">Subtitle</span>
</div>
<!-- Step 3: Genre (Inactive) -->
<div class="progress-step text-center w-1/4">
<div class="w-4 h-4 rounded-full mx-auto mb-2 bg-brand-button-back"></div>
<span class="text-xs text-brand-text-secondary">Genre</span>
</div>
<!-- Step 4: Settings (Inactive) -->
<div class="progress-step text-center w-1/4">
<div class="w-4 h-4 rounded-full mx-auto mb-2 bg-brand-button-back"></div>
<span class="text-xs text-brand-text-secondary">Worldview &amp; Key Settings</span>
</div>
</div>
</div>
<!-- END: ProgressBar -->
</header>
<!-- Form Body -->
<section data-purpose="form-body">
<h2 class="text-xl font-semibold text-white mb-2">2. Project Subtitle</h2>
<!-- Input Group for Subtitle -->
<div class="mt-6" data-purpose="input-group">
<label class="flex items-center text-sm text-brand-text-secondary mb-2" for="project-subtitle">
<!-- Chat icon as per instructions -->
<img alt="chat bubble icon" class="w-5 h-5 mr-2" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWnIPHuRrDTwetzzt-Cv4zx7Du6PgKjWhedBaQmGyomZvSvqgtIMpEYtwj4B9zLc-xqbGzxtpHTpRoSuBadCnTXB0Ma9TOBtSgelfBoa3RQ0qeAoSmbvtXSKjzTJ8cVpIeIzRwxbtdodAmilDArFpmXkQXns7yKkxK5BqYe4r8JNx5Xm_6kFLcUzWM_20QB-IU2PvV8uhXvstZopq1Hiq-G_dOoYTJCXNA_TauqelQlfd3Kx6MVbhORwh_VdXuhLXUY12mFsWxeek"/>
            What's the tag-line for your story?
          </label>
<input class="w-full bg-brand-card border border-brand-border rounded-md px-4 py-2 text-brand-text-primary placeholder-brand-text-secondary focus:ring-2 focus:ring-brand-purple focus:border-transparent transition-all" id="project-subtitle" name="project_subtitle" placeholder="e.g., A tale of magic and destiny" type="text"/>
</div>
</section>
<!-- Form Footer with Action Buttons -->
<footer class="mt-8 pt-8 border-t border-brand-border">
<div class="flex justify-end space-x-4">
<!-- Back button -->
<button class="px-6 py-2 bg-brand-button-back text-brand-text-primary font-semibold rounded-md hover:bg-brand-button-back-hover transition-colors" type="button">Back</button>
<!-- Next button -->
<button class="px-6 py-2 bg-brand-purple text-white font-semibold rounded-md hover:bg-purple-500 transition-colors" type="submit">Next</button>
</div>
</footer>
</main>
<!-- END: ProjectCreationForm -->
</div>
<!-- END: MainContainer -->
</body></html>
