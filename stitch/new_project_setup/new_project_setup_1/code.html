<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create a New Project</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for a modern, clean look -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              'brand-bg': '#100f1c',
              'brand-surface': '#1c1b29',
              'brand-primary': '#6d28d9', // Vibrant purple from mockup
              'brand-primary-hover': '#5b21b6',
              'brand-secondary': '#2d2b3d', // Darker for textarea
              'brand-secondary-hover': '#434153',
              'brand-border': '#343242', // Darker for textarea border
              'brand-text': '#e0e0e0',
              'brand-text-subtle': '#a0a0a0',
            },
            boxShadow: {
              'glow': '0 0 15px 5px rgba(109, 40, 217, 0.5)', // Adjusted glow to new purple
            }
          }
        }
      }
    </script>
<!-- Custom CSS for elements that are complex for Tailwind alone -->
<style data-purpose="custom-progress-bar">
      .progress-line {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 2px;
        background-color: #4a485a; /* brand-border */
        transform: translateY(-50%);
        z-index: 1;
      }
      .progress-line-filled {
        background-color: #5c3dff; /* brand-primary */
        width: 100%; /* Spans all 3 gaps */
        transform-origin: left;
      }
    </style>
</head>
<body class="bg-brand-bg font-sans antialiased text-brand-text">
<!-- BEGIN: MainContainer -->
<main class="min-h-screen w-full flex items-center justify-center p-4" data-purpose="page-wrapper">
<!-- BEGIN: ProjectCreationCard -->
<div class="bg-brand-surface rounded-2xl p-8 md:p-12 w-full max-w-2xl" data-purpose="form-container">
<!-- Card Header -->
<h1 class="font-bold text-center text-white mb-8 text-4xl">Create a New Project</h1>
<!-- BEGIN: ProgressBar -->
<div class="mb-10" data-purpose="progress-stepper">
<!-- This container holds the steps and the connecting line -->
<div class="relative">
<!-- Background progress line -->
<div class="progress-line"></div>
<!-- Filled progress line -->
<div class="progress-line progress-line-filled"></div>
<div class="relative flex justify-between items-center z-10">
<!-- Step 1: Title (Completed) -->
<div class="text-center">
<div class="w-4 h-4 rounded-full bg-brand-primary mx-auto"></div>
<p class="text-sm mt-2 text-brand-text-subtle">Title</p>
</div>
<!-- Step 2: Subtitle (Completed) -->
<div class="text-center">
<div class="w-4 h-4 rounded-full bg-brand-primary mx-auto"></div>
<p class="text-sm mt-2 text-brand-text-subtle">Subtitle</p>
</div>
<!-- Step 3: Genre (Completed) -->
<div class="text-center">
<div class="w-4 h-4 rounded-full bg-brand-primary mx-auto"></div>
<p class="text-sm mt-2 text-brand-text-subtle">Genre</p>
</div>
<!-- Step 4: Worldview & Key Settings (Active) -->
<div class="text-center">
<div class="w-6 h-6 rounded-full bg-brand-primary shadow-glow mx-auto ring-brand-surface"></div>
<p class="text-sm text-white font-medium mt-2">Worldview &amp; Key Settings</p>
</div>
</div>
</div>
</div>
<!-- END: ProgressBar -->
<!-- BEGIN: FormContent -->
<section data-purpose="main-form-content">
<!-- Section Header -->
<h2 class="text-xl font-semibold text-white">4. Worldview &amp; Key Settings</h2>
<p class="text-brand-text-subtle mt-1 mb-6">Choose the worldview and settings, the genre for your story.</p>
<!-- Text Input Area -->
<textarea class="w-full bg-brand-secondary border border-brand-border rounded-lg p-4 placeholder-brand-text-subtle focus:ring-2 focus:ring-brand-primary focus:border-brand-primary transition duration-200" id="worldview-settings" placeholder="Describe your story's worldview, rules, magic systems, and key settings here..." rows="5"></textarea>
<!-- AI Generate Button -->
<button class="bg-brand-primary hover:bg-brand-primary-hover text-white font-semibold py-2 px-6 rounded-lg transition duration-200" type="button">
          AI Generate/Augment
        </button>
<!-- BEGIN: NavigationButtons -->
<div class="flex items-center justify-end gap-4 mt-6" data-purpose="form-navigation">
<!-- Back Button -->
<button class="bg-brand-secondary hover:bg-brand-secondary-hover font-medium py-2 px-6 rounded-lg border border-brand-border transition duration-200 text-brand-text" type="button">
            Back
          </button>
<!-- Finish Button -->
<button class="bg-brand-primary hover:bg-brand-primary-hover text-white font-semibold py-2 px-6 rounded-lg transition duration-200" type="button">
            Finish Setup
          </button>
</div>
<!-- END: NavigationButtons -->
</section>
<!-- END: FormContent -->
</div>
<!-- END: ProjectCreationCard -->
</main>
<!-- END: MainContainer -->
</body></html>
